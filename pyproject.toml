[project]
name = "quant-sentiment-research"
version = "3.0.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
live = ["akshare"]

[tool.pytest.ini_options]
pythonpath = ["src"]
